<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>検索履歴の全削除</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 20px 48px;
            color: #263238;
            background: #f4f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.6;
        }

        .global-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
            padding: 10px;
            background: #ffffff;
            border: 1px solid #d9e0e6;
            border-radius: 4px;
        }

        .global-nav a {
            display: inline-block;
            padding: 7px 12px;
            color: #263238;
            border-radius: 3px;
            font-size: 14px;
            text-decoration: none;
        }

        .global-nav a:hover {
            color: #0d4775;
            background: #eef5fb;
        }

        .global-nav form {
            display: flex;
            align-items: center;
            margin: 0;
            padding: 0;
            background: transparent;
            border: 0;
        }

        .global-nav button {
            padding: 7px 12px;
            color: #263238;
            background: transparent;
            border: 0;
            border-radius: 3px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }

        .global-nav button:hover {
            color: #0d4775;
            background: #eef5fb;
        }

        main {
            max-width: 560px;
            margin: 0 auto;
            padding: 24px;
            background: #ffffff;
            border: 1px solid #d9e0e6;
            border-radius: 4px;
        }

        h1 {
            margin: 0 0 24px;
            color: #1f2d3d;
            font-size: 28px;
            letter-spacing: 0;
        }

        p {
            margin: 0 0 16px;
        }

        .warning {
            color: #b71c1c;
            font-weight: 600;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 24px;
        }

        button {
            padding: 9px 20px;
            color: #ffffff;
            background: #b85a5a;
            border: 1px solid #b85a5a;
            border-radius: 3px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        button:hover {
            background: #994848;
        }

        a {
            color: #1769aa;
            font-weight: 600;
        }

        a:hover {
            color: #0d4775;
        }

        @media (max-width: 600px) {
            body {
                padding: 24px 12px 36px;
            }

            main {
                padding: 18px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <nav class="global-nav" aria-label="メインナビゲーション">
        <a href="{{ url_for('index') }}">商品検索</a>
        <a href="{{ url_for('monitor') }}">監視キーワード</a>
        <a href="{{ url_for('product_history') }}">価格履歴</a>
        <form method="post" action="{{ url_for('logout') }}">
            <button type="submit">ログアウト</button>
        </form>
    </nav>

    <main>
        <h1>検索履歴の全削除</h1>
        <p>本当にすべての検索履歴を削除しますか？</p>
        <p class="warning">この操作は元に戻せません。</p>

        <div class="actions">
            <form method="post" action="/history/clear">
                <button type="submit">すべて削除する</button>
            </form>
            <a href="/">戻る</a>
        </div>
    </main>
</body>
</html>
